<!DOCTYPE html>
<html lang="en" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="utf-8" />
    <title>ERROREN X — Intelligence Beyond Limits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      
      // If we are at the root or project root, redirect to base
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="margin: 0; background-color: #020617; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div style="text-align: center; padding: 20px;">
      <div style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px;">
        <span style="color: #ffffff;">ERROR</span><span style="color: #a78bfa;">X</span>
      </div>
      <p style="font-size: 13px; color: #94a3b8; margin: 0;">Loading workspace...</p>
    </div>
  </body>
</html>
