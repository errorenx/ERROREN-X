    <script>
      // 1. Single Page Apps for GitHub Pages: Restore route from 404.html redirect
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // 2. Ensure repository paths on GitHub Pages have a trailing slash so relative paths resolve correctly
      (function() {
        var pathname = window.location.pathname;
        if (pathname.length > 1 && !pathname.endsWith('/') && !pathname.includes('.')) {
          window.location.replace(pathname + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
