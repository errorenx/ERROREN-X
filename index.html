<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>ERROREN X — Intelligence Beyond Limits</title>

    <meta
      name="description"
      content="ERROREN X — Next-generation AI assistant platform."
    />

    <meta
      property="og:title"
      content="ERROREN X — Intelligence Beyond Limits"
    />

    <meta
      property="og:description"
      content="Next-generation AI assistant platform."
    />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Syne:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100vh;
      }

      body {
        background: #020617;
        color: #f8fafc;
      }

      /* Only a tiny startup fallback.
         It is automatically removed when React starts. */
      #startup-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #f8fafc;
        font-family: Arial, sans-serif;
        transition: opacity 0.2s ease;
      }

      #startup-fallback.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .startup-box {
        text-align: center;
        padding: 24px;
      }

      .startup-logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: white;
        font-size: 24px;
        font-weight: 800;
      }

      .startup-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .startup-text {
        color: #94a3b8;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div id="startup-fallback">
      <div class="startup-box">
        <div class="startup-logo">X</div>
        <div class="startup-title">ERROREN X</div>
        <div class="startup-text">Starting workspace...</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      /*
       * Safety fallback:
       * Never allow the old permanent loading screen to remain.
       */
      window.__ERROREN_X_HIDE_STARTUP__ = function () {
        var screen = document.getElementById("startup-fallback");

        if (screen) {
          screen.classList.add("hidden");

          setTimeout(function () {
            if (screen && screen.parentNode) {
              screen.parentNode.removeChild(screen);
            }
          }, 250);
        }
      };

      /*
       * If React cannot start, do not leave an endless spinner.
       */
      window.setTimeout(function () {
        var screen = document.getElementById("startup-fallback");

        if (screen) {
          screen.innerHTML =
            '<div style="text-align:center;padding:24px;font-family:Arial,sans-serif">' +
            '<div style="font-size:22px;font-weight:700;margin-bottom:8px">ERROREN X</div>' +
            '<div style="color:#94a3b8;font-size:14px">Unable to start the application.</div>' +
            '<button onclick="window.location.reload()" style="margin-top:18px;padding:10px 18px;border:0;border-radius:10px;background:#7c3aed;color:white;cursor:pointer;font-weight:600">Reload</button>' +
            "</div>";
        }
      }, 10000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
